<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%" role="img" aria-label="ArchForge Logo">
  <defs>
    <linearGradient id="af-strut-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="af-strut-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#090D1A" />
    </linearGradient>
    <linearGradient id="af-crossbar" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="af-core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="af-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Architectural Frame (A-Arch Structure) -->
  <!-- Left Pylon -->
  <path d="M32 6 L12 52 L20 56 L32 24 Z" fill="url(#af-strut-left)" />
  <!-- Right Pylon -->
  <path d="M32 6 L32 24 L44 56 L52 52 Z" fill="url(#af-strut-right)" />

  <!-- Inner Architectural Truss Crossbar -->
  <path d="M19 40 L45 40 L43 45 L21 45 Z" fill="url(#af-crossbar)" opacity="0.95" />

  <!-- Engineering Topology Conduit Vectors (Network Graph Lines) -->
  <line x1="32" y1="13" x2="32" y2="32" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <line x1="32" y1="32" x2="21" y2="48" stroke="#38BDF8" stroke-width="1.75" stroke-linecap="round" opacity="0.85" />
  <line x1="32" y1="32" x2="43" y2="48" stroke="#10B981" stroke-width="1.75" stroke-linecap="round" opacity="0.85" />
  <line x1="21" y1="48" x2="43" y2="48" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 2" opacity="0.7" />

  <!-- Apex Cornerstone Node (Requirements / Blueprint) -->
  <circle cx="32" cy="11" r="4.5" fill="#0F172A" stroke="#00F0FF" stroke-width="2" />
  <circle cx="32" cy="11" r="2" fill="#00F0FF" />

  <!-- Left Base Node (Repository AST / Codebase) -->
  <circle cx="21" cy="48" r="3.5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="21" cy="48" r="1.5" fill="#38BDF8" />

  <!-- Right Base Node (Production / Verification Gate) -->
  <circle cx="43" cy="48" r="3.5" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
  <circle cx="43" cy="48" r="1.5" fill="#10B981" />

  <!-- Central Forge Synthesis Reactor (Architecture Core) -->
  <polygon points="32,27 37,32 32,37 27,32" fill="url(#af-core-glow)" filter="url(#af-glow)" />
  <circle cx="32" cy="32" r="2" fill="#FFFFFF" />
</svg>
